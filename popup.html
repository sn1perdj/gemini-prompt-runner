<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Prompt Runner</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="header-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="header-text">
        <h1>Prompt Runner</h1>
        <span class="subtitle">Google Gemini Automation</span>
      </div>
      <button class="header-settings-btn" id="settingsBtn" title="Settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>

    <div id="settingsPanel" class="settings-panel" style="display: none;">
      <div class="form-group" style="margin-top: 0; margin-bottom: 0;">
        <label for="webhookUrl">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
          </svg>
          Google Sheets Webhook URL
        </label>
        <input type="text" id="webhookUrl" class="webhook-input" placeholder="https://script.google.com/macros/s/.../exec">
      </div>
    </div>

    <div class="status-bar" id="statusBar">
      <div class="status-indicator" id="statusDot"></div>
      <span id="statusText">Ready</span>
    </div>

    <div class="progress-container" id="progressContainer" style="display: none;">
      <div class="progress-info">
        <span id="progressLabel">Prompt 0 / 0</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn" data-tab="lite">Lite</button>
      <button class="tab-btn active" data-tab="pro">Pro</button>
      <button class="tab-btn" data-tab="image">Image</button>
    </div>

    <div id="lite-tab" class="tab-content">
      <div class="form-group">
      <label for="systemPrompt">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>
        </svg>
        System Prompt
      </label>
      <textarea id="systemPrompt" placeholder="This will prefix every prompt you send..." rows="4"></textarea>
    </div>

    <div class="form-group">
      <div class="label-row">
        <label>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          Prompts
        </label>
        <span class="badge" id="promptCount">0</span>
      </div>
      <div class="add-prompt-row">
        <textarea id="promptInput" placeholder="Type or paste a prompt, then click Add..." rows="3"></textarea>
        <button class="btn btn-add" id="addPromptBtn" title="Add prompt">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5v14M5 12h14"/>
          </svg>
        </button>
      </div>
      <div class="prompt-list" id="promptList">
        <div class="empty-state" id="emptyState">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#C7D2FE" stroke-width="1.5">
            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/>
          </svg>
          <span>No prompts added yet</span>
        </div>
      </div>
      <div class="list-actions" id="listActions" style="display: none;">
        <button class="btn btn-clear" id="clearAllBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
          </svg>
          Clear All
        </button>
        <button class="btn btn-download" id="downloadResponsesBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          Download Responses
        </button>
      </div>
    </div>


    <div class="option-row">
      <label class="toggle-label">
        <span class="toggle-text">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          New chat per prompt
        </span>
        <span class="toggle-hint">Each prompt starts fresh</span>
      </label>
      <label class="toggle-switch">
        <input type="checkbox" id="newChatToggle" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>

    <div class="buttons">
      <button id="startBtn" class="btn btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M8 5v14l11-7z"/>
        </svg>
        Start
      </button>
      <button id="pauseBtn" class="btn btn-warning" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/>
        </svg>
        Pause
      </button>
      <button id="stopBtn" class="btn btn-danger" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
        Stop
      </button>
    </div>

    </div>

    <div id="pro-tab" class="tab-content active">
      <div class="pro-mode-toggle">
        <span class="mode-label">Mode:</span>
        <div class="segmented-control">
          <input type="radio" id="modeAuto" name="proMode" value="auto" checked>
          <label for="modeAuto">Automatic</label>
          <input type="radio" id="modeManual" name="proMode" value="manual">
          <label for="modeManual">Manual</label>
        </div>
      </div>

      <div class="form-group">
        <div class="label-row">
          <label>Story Idea</label>
        </div>
        <textarea id="proStoryIdea" placeholder="Paste your story idea here..." rows="3"></textarea>
      </div>
      <div class="form-group">
        <div class="label-row">
          <label>Script Outliner Prompt</label>
          <div class="action-buttons">
            <button class="btn-play-step" id="playOutliner" style="display: none;" title="Start from here">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <button class="btn-replay-step" id="replayOutliner" style="display: none;" title="Replay only this prompt">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            </button>
          </div>
        </div>
        <textarea id="proScriptOutliner" placeholder="Enter script outliner prompt..." rows="2"></textarea>
      </div>
      <div class="form-group">
        <div class="label-row">
          <label>Story Architect Prompt</label>
          <div class="action-buttons">
            <button class="btn-play-step" id="playArchitect" style="display: none;" title="Start from here">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <button class="btn-replay-step" id="replayArchitect" style="display: none;" title="Replay only this prompt">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            </button>
          </div>
        </div>
        <textarea id="proStoryArchitect" placeholder="Enter story architect prompt..." rows="2"></textarea>
      </div>
      <div class="form-group">
        <div class="label-row">
          <label>Script Writer Prompt</label>
          <div class="action-buttons">
            <button class="btn-play-step" id="playWriter" style="display: none;" title="Start from here">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <button class="btn-replay-step" id="replayWriter" style="display: none;" title="Replay only this prompt">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            </button>
          </div>
        </div>
        <textarea id="proScriptWriter" placeholder="Enter script writer prompt..." rows="2"></textarea>
      </div>
      <div class="form-group">
        <div class="label-row">
          <label>Scene Details Prompt</label>
          <div class="action-buttons">
            <button class="btn-play-step" id="playScene" style="display: none;" title="Start from here">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <button class="btn-replay-step" id="replayScene" style="display: none;" title="Replay only this prompt">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            </button>
          </div>
        </div>
        <textarea id="proSceneDetails" placeholder="Enter scene details prompt..." rows="2"></textarea>
      </div>
      <div class="form-group">
        <div class="label-row">
          <label>Character Details gen</label>
          <div class="action-buttons">
            <button class="btn-play-step" id="playExtraCharacter" style="display: none;" title="Start from here">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <button class="btn-replay-step" id="replayExtraCharacter" style="display: none;" title="Replay only this prompt">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            </button>
          </div>
        </div>
        <textarea id="extraCharacterPrompt" placeholder="Enter character details prompt..." rows="3"></textarea>
      </div>
      <div class="form-group">
        <div class="label-row">
          <label>Location Details gen</label>
          <div class="action-buttons">
            <button class="btn-play-step" id="playExtraLocation" style="display: none;" title="Start from here">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <button class="btn-replay-step" id="replayExtraLocation" style="display: none;" title="Replay only this prompt">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            </button>
          </div>
        </div>
        <textarea id="extraLocationPrompt" placeholder="Enter location details prompt..." rows="3"></textarea>
      </div>
      
      <div class="buttons">
        <button id="startProBtn" class="btn btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M8 5v14l11-7z"/>
          </svg>
          Start Pro Pipeline
        </button>
        <button id="stopProBtn" class="btn btn-danger" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
          Stop
        </button>
      </div>
    </div>

    <div id="image-tab" class="tab-content">
      <div class="form-group">
        <div class="label-row">
          <label>Image Prompt Gen</label>
          <div class="action-buttons">
            <input type="number" id="imageStartScene" placeholder="Start Scene #" min="1" style="width: 100px; padding: 4px; border-radius: 6px; border: 1.5px solid #E2E8F0; font-size: 11px;">
            <button class="btn-play-step" id="playImagePrompt" style="display: flex;" title="Start from here">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <button class="btn-replay-step" id="replayImagePrompt" style="display: flex;" title="Replay only this prompt">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            </button>
          </div>
        </div>
        <textarea id="imagePromptGen" placeholder="Enter image prompt gen..." rows="4"></textarea>
      </div>
      <div class="buttons">
        <button id="stopImageBtn" class="btn btn-danger" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
          Stop
        </button>
      </div>
    </div>

    <div id="geminiWarning" class="gemini-warning" style="display: none;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
      <span>No Gemini tab found.</span>
      <button class="btn btn-open" id="openGeminiBtn">Open Gemini</button>
    </div>

    <div class="log-container" id="logContainer">
      <div class="log-header">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/>
        </svg>
        Activity Log
      </div>
      <div id="logOutput" class="log-output"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
