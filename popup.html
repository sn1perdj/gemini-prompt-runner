<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Prompt Runner</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="header-text">
        <h1>Prompt Runner</h1>
      </div>
      <button class="header-settings-btn" id="settingsBtn" title="Settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>

    <div class="workspace-controls surface-card">
      <div class="workspace-control-row">
        <div class="pro-mode-toggle">
          <span class="mode-label">Mode</span>
          <div class="segmented-control">
            <input type="radio" id="modeAuto" name="proMode" value="auto" checked>
            <label for="modeAuto">Automatic</label>
            <input type="radio" id="modeManual" name="proMode" value="manual">
            <label for="modeManual">Manual</label>
          </div>
        </div>
        <div class="option-row compact">
          <label class="toggle-label" for="newChatToggle">
            <span class="toggle-text">New chat per step</span>
          </label>
          <label class="toggle-switch">
            <input type="checkbox" id="newChatToggle" checked>
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>
    </div>

    <div id="settingsPanel" class="settings-panel" style="display: none;">
      <div class="form-group" style="margin-top: 0; margin-bottom: 0;">
        <label for="webhookUrl">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
          </svg>
          Google Sheets Webhook URL
        </label>
        <input type="text" id="webhookUrl" class="webhook-input" placeholder="https://script.google.com/macros/s/.../exec">
      </div>
    </div>

    <div class="progress-container" id="progressContainer" style="display: none;">
      <div class="progress-info">
        <span id="progressLabel">Prompt 0 / 0</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="pro">Pro</button>
      <button class="tab-btn" data-tab="image">Image</button>
    </div>

    <div id="pro-tab" class="tab-content active">
      <div class="tab-shell">
        <div class="surface-card preset-bar">
          <div class="preset-controls compact">
            <label for="proPresetSelect" class="preset-inline-label">Prompt Sets</label>
            <select id="proPresetSelect" class="preset-select"></select>
            <button class="btn-icon btn-secondary" id="newPresetBtn" type="button" title="New preset" aria-label="New preset">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                <path d="M12 5v14M5 12h14"/>
              </svg>
            </button>
            <button class="btn-icon btn-danger-soft" id="deletePresetBtn" type="button" title="Delete preset" aria-label="Delete preset">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 6h18"/>
                <path d="M8 6V4h8v2"/>
                <path d="M19 6l-1 14H6L5 6"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="surface-card section-card">
          <div class="section-heading">
            <div>
              <span class="section-eyebrow">Input</span>
              <h3>Story Foundation</h3>
            </div>
          </div>
          <div class="form-group">
            <div class="label-row">
              <label>Story Idea</label>
            </div>
            <textarea id="proStoryIdea" placeholder="Paste your story idea here..." rows="4"></textarea>
          </div>
        </div>

        <div class="surface-card section-card">
          <div class="section-heading">
            <div>
              <span class="section-eyebrow">Core Steps</span>
              <h3>Script Development</h3>
            </div>
          </div>
          <div class="form-group prompt-step" data-step="script_outliner">
            <div class="label-row">
              <label class="step-label">
                <input type="checkbox" class="step-check" id="stepScriptOutliner" data-step="script_outliner">
                <span>Script Outliner Prompt</span>
              </label>
              <button class="btn-edit-step" type="button" data-toggle-step="script_outliner" title="Edit prompt" aria-label="Edit Script Outliner Prompt">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              </button>
            </div>
            <div class="step-editor">
              <textarea id="proScriptOutliner" placeholder="Enter script outliner prompt..." rows="3"></textarea>
            </div>
          </div>
          <div class="form-group prompt-step" data-step="story_architect">
            <div class="label-row">
              <label class="step-label">
                <input type="checkbox" class="step-check" id="stepStoryArchitect" data-step="story_architect">
                <span>Story Architect Prompt</span>
              </label>
              <button class="btn-edit-step" type="button" data-toggle-step="story_architect" title="Edit prompt" aria-label="Edit Story Architect Prompt">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              </button>
            </div>
            <div class="step-editor">
              <textarea id="proStoryArchitect" placeholder="Enter story architect prompt..." rows="3"></textarea>
            </div>
          </div>
          <div class="form-group prompt-step" data-step="script_writer">
            <div class="label-row">
              <label class="step-label">
                <input type="checkbox" class="step-check" id="stepScriptWriter" data-step="script_writer">
                <span>Script Writer Prompt</span>
              </label>
              <button class="btn-edit-step" type="button" data-toggle-step="script_writer" title="Edit prompt" aria-label="Edit Script Writer Prompt">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              </button>
            </div>
            <div class="step-editor">
              <textarea id="proScriptWriter" placeholder="Enter script writer prompt..." rows="3"></textarea>
            </div>
          </div>
          <div class="form-group prompt-step" data-step="story_check">
            <div class="label-row">
              <label class="step-label">
                <input type="checkbox" class="step-check" id="stepStoryCheck" data-step="story_check">
                <span>Story Check Prompt</span>
              </label>
              <button class="btn-edit-step" type="button" data-toggle-step="story_check" title="Edit prompt" aria-label="Edit Story Check Prompt">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><path d="M21 12c0 4.97-4.03 9-9 9s-9-4.03-9-9 4.03-9 9-9 9 4.03 9 9z"/></svg>
              </button>
            </div>
            <div class="step-editor">
              <textarea id="proStoryCheck" placeholder="Enter story check prompt..." rows="3"></textarea>
            </div>
          </div>
          <div class="form-group prompt-step" data-step="story_fix">
            <div class="label-row">
              <label class="step-label">
                <input type="checkbox" class="step-check" id="stepStoryFix" data-step="story_fix">
                <span>Story Fix Prompt</span>
              </label>
              <button class="btn-edit-step" type="button" data-toggle-step="story_fix" title="Edit prompt" aria-label="Edit Story Fix Prompt">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
              </button>
            </div>
            <div class="step-editor">
              <textarea id="proStoryFix" placeholder="Enter story fix prompt..." rows="4"></textarea>
            </div>
          </div>
          <div class="form-group prompt-step" data-step="scene_details">
            <div class="label-row">
              <label class="step-label">
                <input type="checkbox" class="step-check" id="stepSceneDetails" data-step="scene_details">
                <span>Scene Details Prompt</span>
              </label>
              <button class="btn-edit-step" type="button" data-toggle-step="scene_details" title="Edit prompt" aria-label="Edit Scene Details Prompt">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              </button>
            </div>
            <div class="step-editor">
              <textarea id="proSceneDetails" placeholder="Enter scene details prompt..." rows="3"></textarea>
            </div>
          </div>
        </div>

        <div class="surface-card section-card">
          <div class="section-heading">
            <div>
              <span class="section-eyebrow">Support Assets</span>
              <h3>Character and Location Generation</h3>
            </div>
          </div>
          <div class="form-group prompt-step" data-step="extra_character">
            <div class="label-row">
              <label class="step-label">
                <input type="checkbox" class="step-check" id="stepExtraCharacter" data-step="extra_character">
                <span>Character Details Gen</span>
              </label>
              <button class="btn-edit-step" type="button" data-toggle-step="extra_character" title="Edit prompt" aria-label="Edit Character Details Prompt">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              </button>
            </div>
            <div class="step-editor">
              <textarea id="extraCharacterPrompt" placeholder="Enter character details prompt..." rows="4"></textarea>
            </div>
          </div>
          <div class="form-group prompt-step" data-step="extra_location">
            <div class="label-row">
              <label class="step-label">
                <input type="checkbox" class="step-check" id="stepExtraLocation" data-step="extra_location">
                <span>Location Details Gen</span>
              </label>
              <button class="btn-edit-step" type="button" data-toggle-step="extra_location" title="Edit prompt" aria-label="Edit Location Details Prompt">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              </button>
            </div>
            <div class="step-editor">
              <textarea id="extraLocationPrompt" placeholder="Enter location details prompt..." rows="4"></textarea>
            </div>
          </div>
        </div>

        <div class="buttons pro-actions">
          <button id="startProBtn" class="btn btn-primary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path d="M8 5v14l11-7z"/>
            </svg>
            Start Pro Pipeline
          </button>
          <button id="stopProBtn" class="btn btn-danger" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <path d="M18 6L6 18M6 6l12 12"/>
            </svg>
            Stop
          </button>
        </div>
      </div>
    </div>

    <div id="image-tab" class="tab-content">
      <div class="tab-shell">
        <div class="surface-card section-card">
          <div class="section-heading">
            <div>
              <span class="section-eyebrow">Controls</span>
              <h3>Scene Range</h3>
            </div>
            <div class="action-buttons action-buttons-wide">
              <button class="btn-play-step" id="playImagePrompt" style="display: flex;" title="Start from here">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              </button>
              <button class="btn-replay-step" id="replayImagePrompt" style="display: flex;" title="Replay only this prompt">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
              </button>
            </div>
          </div>
          <div class="input-grid">
            <div class="form-group slim">
              <label for="imageStartScene">Start Scene</label>
              <input type="number" id="imageStartScene" class="number-input" placeholder="1" min="1">
            </div>
            <div class="form-group slim">
              <label for="imageRerunScene">Rerun Scene</label>
              <input type="number" id="imageRerunScene" class="number-input" placeholder="Optional" min="1">
            </div>
          </div>
        </div>

        <div class="surface-card section-card">
          <div class="section-heading">
            <div>
              <span class="section-eyebrow">Prompt</span>
              <h3>Image Prompt Generator</h3>
            </div>
          </div>
          <div class="form-group">
            <div class="label-row">
              <label>Image Prompt Gen</label>
            </div>
            <textarea id="imagePromptGen" placeholder="Enter image prompt gen..." rows="5"></textarea>
          </div>
          <div class="form-group">
            <div class="label-row">
              <label>Character Ref</label>
              <button id="importCharacterRefBtn" class="btn btn-secondary btn-inline" type="button">Import</button>
            </div>
            <textarea id="imageCharacterRef" placeholder="Enter character ref..." rows="4"></textarea>
          </div>
        </div>

        <div class="buttons">
          <button id="stopImageBtn" class="btn btn-danger" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <path d="M18 6L6 18M6 6l12 12"/>
            </svg>
            Stop
          </button>
        </div>
      </div>
    </div>

    <div class="legacy-lite" aria-hidden="true">
      <textarea id="systemPrompt"></textarea>
      <textarea id="promptInput"></textarea>
      <div id="promptList">
        <div id="emptyState"></div>
      </div>
      <span id="promptCount"></span>
      <div id="listActions"></div>
      <button id="addPromptBtn" type="button"></button>
      <button id="clearAllBtn" type="button"></button>
      <button id="startBtn" type="button"></button>
      <button id="pauseBtn" type="button"></button>
      <button id="stopBtn" type="button"></button>
      <button id="downloadResponsesBtn" type="button"></button>
    </div>

    <div id="geminiWarning" class="gemini-warning" style="display: none;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
      <span>No Gemini tab found.</span>
      <button class="btn btn-open" id="openGeminiBtn">Open Gemini</button>
    </div>

    <div class="log-container" id="logContainer">
      <div class="log-header">
        <div class="log-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/>
          </svg>
          <span>Activity Log</span>
        </div>
        <button id="clearLogBtn" class="btn-clear-log" type="button">Clear</button>
      </div>
      <div id="logOutput" class="log-output"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
